<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Isa i Geri</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #000;
    }
    body {
      min-height: 100vh;
      min-width: 100vw;
      /* Remove flex centering for desktop scroll */
    }
    img {
      display: block;
      width: 100%;
      height: auto !important;
      max-width: 100vw;
      max-height: 100vh;
    }
    @media (min-width: 768px) {
      img {
        width: auto;
        height: 100vh;
        max-width: 100vw;
        max-height: 100vh;
      }
    }
  </style>
</head>
<body>
  <div class="image-container">
    <img id="wedding-img" src="SaveTheDate.jpg" usemap="#weddingmap" alt="Wedding Invitation" width="2481" height="3508">
  </div>
  <map name="weddingmap">
    <area shape="rect" coords="150, 3030, 1320, 3180" href="https://maps.app.goo.gl/Jf2iKAyXFEtpkZw3A" alt="See location" target="_blank">
  </map>
  <script src="https://cdn.jsdelivr.net/npm/image-map-resizer@1.0.10/js/imageMapResizer.min.js"></script>
  <script>
    window.onload = function() {
      if (window.imageMapResize) {
        imageMapResize();
      }
    };
  </script>
</body>
</html>
