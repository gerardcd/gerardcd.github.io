<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Isa i Geri</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #000;
    }
    body {
      min-height: 100vh;
      min-width: 100vw;
      /* Remove flex centering for desktop scroll */
    }
    img {
      display: block;
      width: 100%;
      height: auto !important;
      max-width: 100vw;
      max-height: 100vh;
    }
    @media (min-width: 768px) {
      img {
        width: auto;
        height: 100vh;
        max-width: 100vw;
        max-height: 100vh;
      }
    }
  </style>
</head>
<body>
  <img id="wedding-img" src="SaveTheDate.jpg" usemap="#weddingmap" alt="Wedding Invitation" width="2481" height="3508">
  <!-- Debug overlay for clickable area -->
  <div id="debug-area" style="position: absolute; background: rgba(255,255,0,0.3); border: 2px dashed orange; pointer-events: none; z-index: 10;"></div>
  <map name="weddingmap">
    <area shape="rect" coords="150, 3030, 1320, 3180" href="https://maps.app.goo.gl/Jf2iKAyXFEtpkZw3A" alt="See location" target="_blank">
  </map>
  <script src="https://cdn.jsdelivr.net/npm/image-map-resizer@1.0.10/js/imageMapResizer.min.js"></script>
  <script>
    function updateDebugArea() {
      var img = document.getElementById('wedding-img');
      var debug = document.getElementById('debug-area');
      var naturalWidth = img.naturalWidth;
      var naturalHeight = img.naturalHeight;
      var displayedWidth = img.clientWidth;
      var displayedHeight = img.clientHeight;
      // Area coords: left=120, top=80, right=200, bottom=120
      var x1 = 120, y1 = 80, x2 = 200, y2 = 120;
      var scaleX = displayedWidth / naturalWidth;
      var scaleY = displayedHeight / naturalHeight;
      debug.style.position = 'absolute';
      debug.style.left = (img.offsetLeft + x1 * scaleX) + 'px';
      debug.style.top = (img.offsetTop + y1 * scaleY) + 'px';
      debug.style.width = ((x2 - x1) * scaleX) + 'px';
      debug.style.height = ((y2 - y1) * scaleY) + 'px';
    }
    window.onload = function() {
      if (window.imageMapResize) {
        imageMapResize();
      }
      updateDebugArea();
    };
    window.onresize = updateDebugArea;
  </script>
</body>
</html>
